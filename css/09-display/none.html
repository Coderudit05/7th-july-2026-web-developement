<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      div {
        background-color: purple;
        color: white;

        display: inline-block;

        
      }

      #box1{
        /* display: none; */
        visibility: hidden;
      }

      span {
        background-color: blue;
        color: white;
        display: inline-block;
       
      }
    </style>
  </head>
  <body>
    <div id="box1">Hello I am div</div>
    <div>Hello I am div</div>
    <span>Hello I am a span</span>
    <span>Hello I am a span</span>
  </body>
</html>
