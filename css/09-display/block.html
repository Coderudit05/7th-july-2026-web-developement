<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>block element</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      #box1 {
        background-color: purple;
        display: inline;
        
        height: 200px;
        width: 200px;
    }
    #box2 {
        background-color: brown;
        display: inline;
        height: 200px;
        width: 200px;
      }
    </style>
  </head>
  <body>
    <span>hehehe</span>
    <div id="box1">Hello I am a div</div>
    <div id="box2">Hello I am another div</div>
  </body>
</html>
