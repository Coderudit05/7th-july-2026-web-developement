<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;

        background-color: rgb(7, 7, 8);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background-color: rgb(238, 204, 204);
        height: 200px;
        width: 350px;
        border-radius: 10px;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .progress-bar {
        height: 50px;
        width: 80%;
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        position: relative;
      }

      .progress-bar::before {
        content: "";
        height: 100%;
        width: 0%;
        position: absolute;
        background-color: greenyellow;


        animation-name: progress-anime;
        animation-duration: 5s;
        animation-timing-function: linear;
      }

      @keyframes progress-anime {
        0% {
          width: 0%;
        }

        20% {
          width: 20%;
        }
        40% {
          width: 40%;
        }
        60% {
          width: 60%;
        }
        80% {
          width: 80%;
        }
        100% {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="progress-bar"></div>
    </div>
  </body>
</html>
