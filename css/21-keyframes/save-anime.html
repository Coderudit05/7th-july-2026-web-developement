<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        background-color: black;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background-color: white;
        height: 250px;
        width: 400px;

        border-radius: 10px;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }

      .dot {
        height: 50px;
        width: 50px;
        border-radius: 50%;

        animation-name: wave-anime;
        animation-duration: 1s;
        animation-iteration-count: infinite;

        
      }

      .dot:nth-child(1) {
        background-color: blueviolet;
        animation-delay: 0.1s;
    }
    .dot:nth-child(2) {
        background-color: aquamarine;
        animation-delay: 0.3s;
      }
      .dot:nth-child(3) {
        background-color: peru;
      }

      .dot:nth-child(4) {
        background-color: greenyellow;
      }
      .dot:nth-child(5) {
        background-color: brown;
      }


      @keyframes wave-anime {
        0%,100%{
            transform: translateY(0px);
        }      
        50%{
            transform: translateY(-70px);
        }  
      }


    </style>
  </head>
  <body>
    <div class="card">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </body>
</html>
