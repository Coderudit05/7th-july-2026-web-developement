<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: black;
        color: white;
      }

      .box {
        height: 400px;
        width: 400px;
        border: 2px solid white;

        margin: 50px;

        overflow: auto;
      }

      .child{
        height: 500px;
        width: 500px;
        background-color: peru;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="child"></div>
    </div>
  </body>
</html>
