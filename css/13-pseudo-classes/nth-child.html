<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body{
        background-color: black;
        color: white;
      }

      h1:nth-child(4){
        background-color: purple;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Heading h1</h1>
    <h1>Heading h1 two</h1>
    <h1>Heading h1 three</h1>
    <h1>Heading h1 four</h1>
    <h1>Heading h1 five</h1>
    <h1>Heading h1 six</h1>
    <h1>Heading h1 seven</h1>
    <h1>Heading h1 eight</h1>
  </body>
</html>
