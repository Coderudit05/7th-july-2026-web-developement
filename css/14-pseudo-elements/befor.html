<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        background-color: black;
        color: white;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      button {
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 20px;
        border: none;

        position: relative;
        overflow: hidden;

        background-color: transparent;
        border: 1px solid white;
        color: white;
      }

      /* button::before{
        content: '(';
      }
      button::after{
        content: ')';
      } */

      button::before {
        content: "";
        height: 100%;
        width: 0%;
        background-color: blueviolet;

        position: absolute;

        top: 0;
        left: 0;
        z-index: -1;

        transition-property: all;
        transition-duration: 0.3s;
      }

      button:hover::before {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <button>Hover Me</button>
  </body>
</html>
