<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images relative path</title>

</head>
<body>

    <!-- same level of image -->
    <img height="400" src="img1.avif" alt="">
    
    <!-- image inside the inner foler -->

    <img height="400" src="assets/img2.png" alt="">
    
    
    <!-- image outside the folder -->
    <img height="400" src="../img3.avif" alt="">
</body>
</html>
